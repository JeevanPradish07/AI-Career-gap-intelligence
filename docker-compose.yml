version: "3.9"

services:
  # ── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: career_postgres
    environment:
      POSTGRES_USER: careeruser
      POSTGRES_PASSWORD: careerpass
      POSTGRES_DB: career_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careeruser -d career_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Celery Broker + Cache) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: career_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (optional DB viewer — http://localhost:5050) ──────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: career_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@career.local
      PGADMIN_DEFAULT_PASSWORD: adminpass
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

# ── Usage ─────────────────────────────────────────────────────────────────────
# Start:    docker-compose up -d
# Stop:     docker-compose down
# Logs:     docker-compose logs -f postgres
# DB viewer: http://localhost:5050  (admin@career.local / adminpass)
